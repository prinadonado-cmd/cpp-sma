name: CMake CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ doxygen

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Run benchmark
        run: ./build/sma_benchmark --benchmark_min_time=0.2s

      - name: Generate documentation
        run: |
          doxygen Doxyfile
          test -s docs/html/index.html
          test -s docs/html/sma_8hpp.html
          grep -q "calculate_sma" docs/html/sma_8hpp.html

      - name: Upload documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/html

  deploy-docs:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4